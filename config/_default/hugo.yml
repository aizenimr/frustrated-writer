services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
  googleAnalytics:
    id: G-YZF0GDK8SQ

module:
  imports:
  - path: github.com/adityatelange/hugo-PaperMod
  mounts:
    - disableWatch: false
      source: content
      target: content
      sites:
        complements: {}
        matrix: {}
    - disableWatch: false
      source: data
      target: data
      sites:
        complements: {}
        matrix: {}
    - disableWatch: false
      source: layouts
      target: layouts
      sites:
        complements: {}
        matrix: {}
    - disableWatch: false
      source: i18n
      target: i18n
      sites:
        complements: {}
        matrix: {}
    - disableWatch: false
      source: archetypes
      target: archetypes
      sites:
        complements: {}
        matrix: {}
    - disableWatch: false
      source: assets
      target: assets
      sites:
        complements: {}
        matrix: {}
    - disableWatch: false
      source: static
      target: static
      sites:
        complements: {}
        matrix: {}
    - source: static/data
      target: assets/static/data

related:
  includeNewer: false
  threshold:  80
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80