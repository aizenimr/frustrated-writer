# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: https://aizenimr.com/
locale: he-il
title: הכותב המתוסכל
copyright: "© נמרוד איזנברג"

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["post"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 10

languages:
  he:
    label: "Hebrew"
    direction: "rtl"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
      month: month
      year: year
    permalinks:
      categories: "/category/:slug/"
      month: "/:year/:month/"
      series: "/series/:slug/"
      tags: "/tag/:slug/"
      year: "/:year/"
      page:
        page: "/:slug/"
        posts: "/:year/:month/:day/:slug/"
    menu:
      main:
        - name: אודות
          url: about
          weight: 1
        - name: סיפורים
          url: stories/
          weight: 2
        - name: סטטוסים
          url: סטטוסים/
          weight: 3
        - name: חיפוש
          url: search/
          weight: 4
        - name: ארכיון
          url: archives
          weight: 5
        - name: קטגוריות
          url: categories/
          weight: 6
        - name: תגיות
          url: tags/
          weight: 7
        - name: סדרות
          url: series/
          weight: 8

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true
  rss:
    baseName: rss
    isHTML: false
    isPlainText: false
    mediaType: application/rss+xml
    noUgly: true
    notAlternative: false
    path: ''
    permalinkable: false
    protocol: ''
    rel: alternate
    root: false
    ugly: false
    weight: 0

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

