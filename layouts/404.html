{{- define "main" }}
<script>
(() => {
  const start = () => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const paragraphs = [...document.querySelectorAll(".typewriter p")];
    const splitText = (text) => {
      if (typeof Intl.Segmenter === "function") {
        return [...new Intl.Segmenter("he", { granularity: "grapheme" }).segment(text)]
          .map(item => item.segment);
      }
      return Array.from(text);
    };

    const characters = paragraphs.map(p => splitText(p.textContent));
    paragraphs.forEach(p => p.textContent = "");

    let paragraphIndex = 0;
    let characterIndex = 0;
    const characterDelay = 100;
    const paragraphDelay = 500;

    function typeNext() {
      if (paragraphIndex >= paragraphs.length) return;

      if (characterIndex >= characters[paragraphIndex].length) {
        paragraphIndex++;
        characterIndex = 0;
        setTimeout(typeNext, paragraphDelay); // pause between paragraphs
        return;
      }

      paragraphs[paragraphIndex].append(characters[paragraphIndex][characterIndex++]);
      setTimeout(typeNext, characterDelay); // delay per character; adjust to taste
    }

    typeNext();
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
<div>
    <article class="post-single">
        <header class="post-header">
            <h1 class="post-title entry-hint-parent">
            העמוד המבוקש לא נמצא
            </h1>
        </header> 
        <div class="post-content md-content typewriter">
            {{- delimit hugo.Data.ErrorPage "\n\n" | print | markdownify -}}
        </div>
    </article>
</div>
{{- end }}{{/* end main */ -}}
