{{ with site.RegularPages.Related . | first 5 }}
<div class="related-posts">
    <h3>פוסטים קשורים:</h3>
    <div class="related-posts-list">
    {{- $list := slice -}}
    {{- range . -}}
        {{- $list = $list | append (printf "- [%s](%s)" .LinkTitle .RelPermalink) -}}
    {{- end -}}
    {{- delimit $list "\n" | markdownify -}}
    </div>
</div>
{{ end }}
