{{- with site.Params.bluesky -}}
<script type="module" src="https://cdn.jsdelivr.net/npm/bsky-embed/dist/bsky-embed.es.js" async></script>
<bsky-embed
  username="{{- .bskyUser -}}"
  limit="{{- with .bskyLimit -}}{{- . -}}{{- else -}}{{- 5 -}}{{- end -}}"
  link-image="true"
  custom-styles=".flex { display: unset; }
        .w-full {font-size: 0.9rem; max-width :unset;}
        .whitespace-nowrap {white-space: normal;}"
  {{- with .loadmore -}}load-more="{{- . -}}"{{- end -}}
  {{- with .filter -}}filter="{{- . -}}"{{- end -}}
>
</bsky-embed>
{{- end -}}
