{{ $emojis := dict
  "caution" ":exclamation:"
  "important" ":point_left:"
  "note" ":information_source:"
  "tip" ":bulb:"
  "warning" ":warning:"
}}

<figure>
  {{- if eq .Type "alert" -}}
    <blockquote class="alert">
      <div class="alert-heading">
        {{- transform.Emojify (index $emojis .AlertType) -}}
      </div>
      <div>
        {{- .Text -}}
      </div>
    </blockquote>
  {{- else -}}
    <blockquote class="quote">
      {{- .Text -}}
    </blockquote>
    {{- $caption := .Attributes.caption -}}
    {{- $cite := .Attributes.cite -}}
    {{- with $caption -}}
      <figcaption>
          {{- . | safeHTML -}}
          {{- with $cite -}}
            , <cite>{{- . | markdownify -}}</cite>
          {{- end -}}
      </figcaption>
    {{- end -}}
  {{- end -}}
</figure>
